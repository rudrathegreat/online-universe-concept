<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbital — Explore the solar system</title><link rel="stylesheet" href="style.css"><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head><body><div id="home" class="screen"><main><div class="section-title"><span>AVAILABLE VIEWS</span><span>01 / 01</span></div><button id="launch" class="view-card"><div class="card-art"><div class="sun-art"></div><div class="orbit o1"></div><div class="orbit o2"></div><div class="orbit o3"></div><div class="planet-art"></div><span class="art-label">OUR COSMIC NEIGHBORHOOD</span></div><div class="card-copy"><div><span class="tag">INTERACTIVE VIEW <i>●</i> READY TO EXPLORE</span><h2>Solar System</h2><p>One star. Nine worlds. Endless perspective.</p></div><span class="arrow">↗</span></div></button></main></div><div id="explorer" class="screen hidden"><canvas id="scene"></canvas><button id="back" class="back">← &nbsp; ALL VIEWS</button><aside class="info"><div class="info-top"><span>NOW VIEWING</span><span id="index">00 / 09</span></div><h2 id="name">The Sun</h2><p id="description">The star at the center of our solar system.</p><div class="info-stat"><span>DISTANCE FROM SUN</span><strong id="distance">0 AU</strong></div><div class="info-stat"><span>ORBITAL PERIOD</span><strong id="period">—</strong></div></aside><div class="time-control"><label for="time-speed">TIME SPEED</label><select id="time-speed" aria-label="Time speed"><option value="0">Paused</option><option value="0.1">0.1x</option><option value="0.5">0.5x</option><option value="1" selected>1x - Real time</option><option value="10">10x</option><option value="100">100x</option><option value="1000">1,000x</option><option value="10000">10,000x</option><option value="100000">100,000x</option><option value="1000000">1,000,000x</option></select></div><label class="size-toggle"><input id="minimum-size" type="checkbox" checked> Minimum planet size (10 px)</label><div id="error" class="error hidden">Unable to load the 3D view. Check your internet connection and reload.</div></div><script type="module" src="app.js"></script></body></html>
