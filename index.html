<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbital — Explore the solar system</title><link rel="stylesheet" href="style.css"><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head><body><div id="home" class="screen"><main><div class="section-title"><span>Available views</span><span>01 / 01</span></div><button id="launch" class="view-card"><div class="card-art"><div class="sun-art"></div><div class="orbit o1"></div><div class="orbit o2"></div><div class="orbit o3"></div><div class="planet-art"></div><span class="art-label">Our cosmic neighborhood</span></div><div class="card-copy"><div><span class="tag">Interactive view <i>●</i> Ready to explore</span><h2>Solar system</h2><p>One star. Nine worlds. Endless perspective.</p></div><span class="arrow">↗</span></div></button></main></div><div id="explorer" class="screen hidden"><canvas id="scene"></canvas><button id="back" class="back">← &nbsp; All views</button><aside class="info"><h2 id="name">The Sun</h2><p id="description">The star at the center of our solar system.</p><div class="info-stat"><span id="distance-label">Distance from Sun</span><strong id="distance">0 AU</strong></div><div class="info-stat"><span>Orbital period</span><strong id="period">—</strong></div><div class="info-stat"><span>Mean radius</span><strong id="radius"></strong></div><div class="info-stat" id="rotation-row"><span>Rotation period</span><strong id="rotation"></strong></div><div class="info-stat" id="gravity-row"><span>Surface gravity</span><strong id="gravity"></strong></div><div class="info-stat" id="temperature-row"><span>Mean temperature</span><strong id="temperature"></strong></div><p class="info-note" id="rotation-note">Rotation period is approximate.</p><a class="info-source" target="_blank" rel="noope
